[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investor-intel"
version = "0.1.0"
description = "Personal investment intelligence collection, analysis, and portfolio decision-support system"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0.1",
    "typer>=0.12",
    "structlog>=24.1",
    "httpx>=0.28.1",
    "anthropic>=0.119.0",
    "jinja2>=3.1.6",
    "pypdf>=5.0",
    "cryptography>=42.0",
    "trafilatura>=2.0",
    "lxml[html-clean]>=5.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0.12",
]
telethon = [
    "telethon>=1.44,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["investor_intel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Jinja2 markdown table rows must stay on one physical line to render correctly.
"investor_intel/reports/daily_report_renderer.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "respx>=0.23.1",
]
