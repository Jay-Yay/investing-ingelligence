name: Daily collect and report

# Runs the collect -> analyze -> portfolio -> report pipeline on a schedule.
#
# Scope note: `vault/` and `data/` are gitignored in this repo (the Obsidian vault and its
# SQLite index are the user's data, not the tool's source) — this workflow does not commit or
# push them anywhere. On GitHub-hosted runners the job's filesystem is ephemeral, so results
# from one run are not visible to the next. For persistent storage across runs, point
# --vault-path / --sqlite-path at a self-hosted runner's persistent disk, or add a step here to
# sync to your own storage (a separate private repo, cloud storage, etc.) before the job ends.

on:
  schedule:
    # 09:00 KST == 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          DAILY_LLM_BUDGET_USD: ${{ vars.DAILY_LLM_BUDGET_USD }}
          MONTHLY_LLM_BUDGET_USD: ${{ vars.MONTHLY_LLM_BUDGET_USD }}
        run: uv run python -m investor_intel run-daily
