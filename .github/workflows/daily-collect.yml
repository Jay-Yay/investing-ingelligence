name: Daily collect

# Runs the `collect` and `regime run-daily` steps on a schedule - neither uses an LLM, so both
# are safe unattended. Analysis (analyze -> portfolio -> report) is run locally via Claude Code,
# not here, since LLM calls from an unattended cron are hard to review before they spend API
# budget.
#
# Persistence: GitHub-hosted runners are ephemeral, so this workflow keeps `vault/` and `data/`
# (both normally gitignored) on a dedicated `data` branch of this repo instead. Each run checks
# out that branch into `state/`, runs `collect` against `state/vault` / `state/data`, and commits
# the result back. Locally, pull the `data` branch (e.g. `git worktree add ../ii-data data`) and
# point `analyze` / `portfolio` / `report` at that checkout's vault/data paths.

on:
  schedule:
    # 09:00 KST == 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # First run does a full historical backfill (years of 13F/DART filings across every
    # tracked source) at a conservative 2 req/s rate limit, which can take well over an hour.
    # Later runs are incremental and finish in seconds/minutes - this ceiling only matters
    # for that first (or any large backfill) run.
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check out (or create) data branch into state/
        run: |
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add state origin/data
            git -C state checkout -b data
          else
            git worktree add --detach state
            git -C state checkout --orphan data
            git -C state rm -rf . > /dev/null 2>&1 || true
            git -C state commit --allow-empty -m "init data branch"
          fi
          mkdir -p state/vault state/data

      # data/index.sqlite3 is not committed (see .gitignore on this branch) - it's a derived
      # cache of vault/, rebuilt here from whatever vault/ content is already on the branch
      # (which may include documents pushed by other writers - local Macs also run collect/
      # analyze/web-research against this same branch) so dedup checks below see everything.
      - name: Rebuild sqlite index from vault
        run: |
          uv run python -m investor_intel reindex \
            --vault-path state/vault \
            --sqlite-path state/data/index.sqlite3

      - name: Run collect
        id: collect
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          # unbuffer stdout so per-source progress lines actually reach the log as they
          # happen, instead of sitting in Python's block buffer and vanishing if the job
          # gets cancelled (e.g. by timeout-minutes) before the process exits cleanly.
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m investor_intel collect \
            --vault-path state/vault \
            --sqlite-path state/data/index.sqlite3

      # 시장 국면 추적(regime)은 LLM을 쓰지 않는 순수 수치 지표라 무인 실행이 안전하다. 위
      # collect와 별개 단계로 두고 실패해도 job 전체를 실패시키지 않는다(continue-on-error) -
      # FRED_API_KEY가 아직 Secrets에 없으면 해당 지표만 unavailable로 남고 나머지는 계속
      # 수집된다. vault/60_MarketRegime, vault/50_Reports/MarketRegime에 저장되므로 아래
      # "git add vault"가 그대로 커밋해준다.
      - name: Run regime run-daily
        id: regime
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          uv run python -m investor_intel regime run-daily \
            --vault-path state/vault

      # `if: always()` matters here, not just `continue-on-error` above: if the job hits
      # timeout-minutes and gets cancelled mid-collect, steps without always() are skipped
      # entirely - which previously meant a timeout silently threw away everything collected
      # up to that point. With always(), whatever's on disk still gets committed.
      #
      # vault/ and data/checkpoints.json are committed - data/index.sqlite3 itself stays
      # gitignored on this branch (binary, unmergeable across the multiple writers that push
      # here; rebuilt via reindex instead). checkpoints.json is the one piece of collector_state
      # that needs to survive across runs (source_id -> last_seen_id etc.) - without it every
      # run starts with an empty collector_state table and every source falls back to processing
      # its entire available history instead of just what's new, which is what let a handful of
      # slow/unbounded sources (central bank statements, IB insights) balloon into the ~3h
      # timeouts seen 2026-08-03~10.
      - name: Commit and push collected vault data
        if: always()
        run: |
          cd state
          git add vault
          git add data/checkpoints.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new data"
          else
            git commit -m "collect: $(date -u +%Y-%m-%d)"
            git push origin HEAD:data
          fi

      - name: Fail job if collect had errors
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
