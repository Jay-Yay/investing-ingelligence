name: CI

# Runs the test suite and static checks on every push and pull request so a breaking change is
# caught immediately, instead of silently failing the next scheduled `daily-collect.yml` run.

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra telethon

      - name: Run tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy investor_intel

  # 데이터 품질 게이트. 검색 품질의 상한은 원문 품질이므로, 인코딩이 깨진 문서가 늘거나
  # 색인이 밀리는 것을 코드 변경과 같은 급으로 막는다. `data` 브랜치의 vault/data를 읽고
  # 아무것도 쓰지 않는다.
  data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR에서는 돌리지 않는다 - 포크에서는 data 브랜치를 못 읽고, 데이터 상태는 코드 변경과
    # 무관하게 바뀌므로 PR을 막을 근거가 되지 않는다.
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check out data branch into state/
        id: data
        run: |
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add state origin/data
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "data 브랜치가 없어 품질 게이트를 건너뛴다"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # 카탈로그는 커밋되지 않는 파생 캐시라 vault에서 다시 만든다. `reindex`가 본문에서
      # 품질을 직접 재므로, vault에 enrich-vault를 적용했는지와 무관하게 정확한 수치가 나온다.
      - name: Rebuild catalog and check quality
        if: steps.data.outputs.present == 'true'
        run: |
          uv run python -m investor_intel reindex \
            --vault-path state/vault --sqlite-path state/data/index.sqlite3
          uv run python -m investor_intel index status \
            --sqlite-path state/data/index.sqlite3 \
            --search-db state/data/search_index.sqlite3 \
            --structured-db state/data/structured.sqlite3 \
            --max-corrupt 0

      # 검색 품질 게이트. 번들이 없으면(첫 실행이거나 아직 안 만들었으면) 여기서 새로
      # 만든다 - 결정론적 파생물이라 vault만 있으면 언제든 다시 만들 수 있다.
      # `index update`는 상태 기록이 없으면 자동으로 전량 빌드로 떨어진다(state/data는
      # gitignore돼 매 실행마다 비어 있으므로 매번 전량 빌드다).
      #
      # 임계값은 현재 측정치(recall@10 0.458 / hit@1 0.208, 24건 수동 평가셋)보다 낮게
      # 잡았다 - 정답 문서 중 일부(D-005~D-008)가 실제로 인코딩이 깨진 DART 문서라
      # corrupt 기본 제외 정책상 원리적으로 못 찾는다(재수집 전까지는 버그가 아니다).
      # `refetch --reason corrupt`로 그 문서들을 되살리면 임계값을 올릴 여지가 있다.
      - name: Build search index and check retrieval quality
        if: steps.data.outputs.present == 'true'
        run: |
          uv run python scripts/build_knowledge_bundle.py \
            --vault state/vault --db state/data/index.sqlite3
          uv run python -m investor_intel index update \
            --vault-path state/vault --search-db state/data/search_index.sqlite3
          uv run python scripts/eval_okf_retrieval.py --gate \
            --search-db state/data/search_index.sqlite3 \
            --bundle state/vault/20_Knowledge \
            --queries eval/manual_queries.json \
            --min-recall10 0.35 --min-hit1 0.10
